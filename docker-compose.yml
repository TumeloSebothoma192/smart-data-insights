services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-insights-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartinsights
    volumes:
      - pg_data:/var/lib/postgresql/data

  python-service:
    build: ./python-service
    container_name: smart-insights-python
    restart: unless-stopped
    # Internal only: the Node API is its only client. Publishing 8000 would let anyone call it directly.
    expose:
      - "8000"
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-compose-token}
    volumes:
      - python_models:/app/saved_models

  server:
    build: ./server
    container_name: smart-insights-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/smartinsights
      PGSSL: disable
      # Required: compose refuses to start without it (a public default would let anyone forge logins).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET first - see README Quick Start}
      NODE_ENV: production
      PYTHON_SERVICE_URL: http://python-service:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-compose-token}
      CLIENT_URL: http://localhost:3000
    depends_on:
      - postgres
      - python-service

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: smart-insights-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pg_data:
  python_models:
